<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>National Freebirds Day</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: transparent;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    /* =========================
       SHARED
       ========================= */

    .nfd {
  position: relative;
  width: 100%;
  height: 340px;
  overflow: hidden;
  background: #83c9d7;
  color: #292929;
  border-radius: 12px;
}

    .state {
      width: 100%;
    }

    .hidden {
      display: none !important;
    }

    /* Decorative texture */
    .nfd::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .12;
      background-image:
        radial-gradient(circle at 20% 30%, #ffffff 0 2px, transparent 3px),
        radial-gradient(circle at 75% 70%, #ffffff 0 2px, transparent 3px),
        radial-gradient(circle at 55% 15%, #ffffff 0 1px, transparent 2px);
      background-size: 90px 90px, 120px 120px, 70px 70px;
    }

    /* =========================
       COUNTDOWN STATE
       ========================= */

    .countdown-state {
      position: relative;
      z-index: 1;
      height: 340px;
      padding: 28px 5%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(25px, 5vw, 80px);
    }

    .cake-wrap {
      flex: 0 1 350px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .cake {
      display: block;
      width: min(100%, 310px);
      height: auto;
      filter: drop-shadow(0 10px 8px rgba(0,0,0,.15));
      transform: rotate(-2deg);
    }

    .countdown-content {
      flex: 1 1 650px;
      max-width: 760px;
      text-align: center;
    }

    .birthday-line {
      margin-bottom: 7px;
      font-size: clamp(14px, 1.7vw, 19px);
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .headline {
      margin: 0;
      font-size: clamp(31px, 4.3vw, 58px);
      line-height: .98;
      font-weight: 900;
      letter-spacing: -1.5px;
      text-transform: uppercase;
    }

    .headline .orange {
  display: block;
  color: #ff651d;
}
    
    .countdown-line {
  display: block;
  white-space: nowrap;
}

    .date {
      margin-top: 11px;
      font-size: clamp(15px, 1.6vw, 19px);
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .timer {
      margin-top: 24px;
      display: flex;
      justify-content: center;
      gap: clamp(7px, 1vw, 14px);
    }

    .unit {
      width: clamp(92px, 10vw, 135px);
      padding: 15px 8px 12px;
      background: #292929;
      color: white;
      border-radius: 10px;
      box-shadow: 4px 5px 0 #ff651d;
    }

    .number {
      display: block;
      font-size: clamp(34px, 4.5vw, 57px);
      line-height: 1;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }

    .label {
      display: block;
      margin-top: 7px;
      font-size: clamp(9px, .9vw, 11px);
      font-weight: 900;
      letter-spacing: 1.5px;
      opacity: .78;
    }

    /* =========================
       NATIONAL FREEBIRDS DAY
       ========================= */

    .celebration-state {
      position: relative;
      z-index: 1;
      min-height: 390px;
      padding: 22px 5%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(25px, 5vw, 70px);
    }

    .happy-wrap {
      flex: 0 1 510px;
      text-align: center;
    }

    .happy-art {
      display: block;
      width: min(100%, 500px);
      height: auto;
      margin: 0 auto;
      filter: drop-shadow(0 8px 5px rgba(0,0,0,.10));
    }

    .celebrating {
      display: inline-block;
      margin-top: 8px;
      padding: 8px 16px;
      background: #292929;
      color: white;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      transform: rotate(-1deg);
    }

    .bowl-wrap {
      flex: 0 1 520px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .bowl {
      display: block;
      width: min(100%, 500px);
      height: auto;
      filter: drop-shadow(0 12px 10px rgba(0,0,0,.18));
    }

    /* =========================
       CONFETTI
       ========================= */

    .confetti {
      position: absolute;
      z-index: 0;
      top: -20px;
      width: 9px;
      height: 18px;
      opacity: .75;
      animation: fall linear infinite;
    }

    @keyframes fall {
      from {
        transform: translateY(-30px) rotate(0deg);
      }
      to {
        transform: translateY(500px) rotate(540deg);
      }
    }

    /* =========================
       POST EVENT
       ========================= */

    .post-state {
      position: relative;
      z-index: 1;
      min-height: 250px;
      padding: 45px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .post-inner {
      max-width: 750px;
    }

    .post-inner h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 58px);
      line-height: 1;
      font-weight: 900;
      text-transform: uppercase;
    }

    .post-inner p {
      margin: 14px 0 0;
      font-size: 17px;
      font-weight: 700;
    }

  /* =========================
   MOBILE
   ========================= */

@media (max-width: 760px) {

  /* COUNTDOWN */

  .countdown-state {
  height: 340px;
  min-height: 0;
  padding: 12px;
  display: grid;
  grid-template-rows: 105px 1fr;
  gap: 12px;
  align-items: start;
}

.cake-wrap {
  width: 100%;
  height: 105px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0;
}

.cake {
  display: block;
  width: 100px;
  height: 100px;
  object-fit: contain;
  transform: rotate(-2deg);
  filter: drop-shadow(0 5px 4px rgba(0,0,0,.12));
}

.countdown-content {
  width: 100%;
  min-width: 0;
  text-align: center;
}
  
.birthday-line {
  margin: 0 0 5px;
  font-size: 10px;
  line-height: 1;
  letter-spacing: 1.7px;
}
  
  .headline {
    font-size: clamp(21px, 6.7vw, 31px);
    line-height: .95;
    letter-spacing: -0.5px;
  }

  .date {
    margin-top: 6px;
    font-size: 10px;
    letter-spacing: 1.3px;
  }

  .timer {
    margin-top: 11px;
    gap: 5px;
  }

  .unit {
    width: calc(25% - 4px);
    min-width: 0;
    padding: 8px 2px 7px;
    border-radius: 7px;
    box-shadow: 2px 3px 0 #ff651d;
  }

  .number {
    font-size: clamp(24px, 7.5vw, 34px);
  }

  .label {
    margin-top: 4px;
    font-size: 7px;
    letter-spacing: .4px;
  }


  /* NATIONAL FREEBIRDS DAY */

 /* NATIONAL FREEBIRDS DAY */

.celebration-state {
  height: 340px;
  min-height: 0;
  padding: 12px 10px;
  flex-direction: column;
  justify-content: center;
  gap: 8px;
}

.happy-wrap {
  flex: none;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.bowl-wrap {
  flex: none;
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
}

.happy-art {
  width: min(92%, 205px);
  max-height: 175px;
  object-fit: contain;
}

.celebrating {
  margin-top: 3px;
  padding: 5px 11px;
  font-size: 9px;
  letter-spacing: 1.5px;
}

.bowl {
  width: min(92%, 260px);
  max-height: 155px;
  object-fit: contain;
  }
}
    @media (max-width: 380px) {

  .celebration-state {
    padding: 10px 8px;
    gap: 6px;
  }

  .happy-art {
    width: min(78%, 175px);
    max-height: 125px;
  }

  .celebrating {
    margin-top: 2px;
    padding: 4px 8px;
    font-size: 8px;
    letter-spacing: 1px;
  }

  .bowl {
    width: min(90%, 220px);
    max-height: 135px;
  }
}

    /* =========================
   VERY NARROW MOBILE
   ========================= */

@media (max-width: 360px) {

  .countdown-state {
    padding: 10px 6px;
    grid-template-rows: 88px 1fr;
    gap: 7px;
  }

  .cake-wrap {
    height: 88px;
  }

  .cake {
    width: 82px;
    height: 82px;
    max-height: 82px;
  }

  .birthday-line {
    font-size: 8px;
    letter-spacing: 1.2px;
    margin-bottom: 4px;
  }

 .headline {
  font-size: clamp(15px, 7.2vw, 21px);
  line-height: .95;
  letter-spacing: -0.4px;
  white-space: normal;
}

.headline .orange {
  display: block;
  font-size: .95em;
}
  .date {
    margin-top: 6px;
    font-size: 8px;
    letter-spacing: .8px;
  }

  .timer {
    margin-top: 10px;
    gap: 3px;
  }

  .unit {
    width: calc(25% - 2px);
    padding: 7px 1px 6px;
    border-radius: 5px;
    box-shadow: 1px 2px 0 #ff651d;
  }

  .number {
    font-size: clamp(20px, 10vw, 27px);
  }

  .label {
    margin-top: 3px;
    font-size: 5.5px;
    letter-spacing: 0;
  }
}
    
    @media (prefers-reduced-motion: reduce) {
      .confetti {
        animation: none;
        display: none;
      }
    }

  </style>
</head>

<body>

  <main class="nfd" id="nfd">

    <!-- COUNTDOWN -->
    <section class="state countdown-state" id="countdownState">

      <div class="cake-wrap">
        <img
          class="cake"
          src="assets/Cake_Sticker.png"
          alt="Freebirds 39th birthday cake">
      </div>

      <div class="countdown-content">

        <div class="birthday-line">
          Celebrating 39 Years
        </div>

        <h1 class="headline">
  <span class="countdown-line">Countdown to</span>
  <span class="orange">National Freebirds Day</span>
</h1>
        <div class="date">
          October 28, 2026
        </div>

        <div class="timer">

          <div class="unit">
            <span class="number" id="days">--</span>
            <span class="label">DAYS</span>
          </div>

          <div class="unit">
            <span class="number" id="hours">--</span>
            <span class="label">HOURS</span>
          </div>

          <div class="unit">
            <span class="number" id="minutes">--</span>
            <span class="label">MINUTES</span>
          </div>

          <div class="unit">
            <span class="number" id="seconds">--</span>
            <span class="label">SECONDS</span>
          </div>

        </div>

      </div>

    </section>


    <!-- OCTOBER 28 -->
    <section class="state celebration-state hidden" id="celebrationState">

      <div class="happy-wrap">

        <img
          class="happy-art"
          src="assets/Happy_NFD_T.png"
          alt="Happy National Freebirds Day">

        <div class="celebrating">
          Celebrating 39 Years
        </div>

      </div>

      <div class="bowl-wrap">

        <img
          class="bowl"
          id="birthdayBowl"
          data-src="assets/Bowl_Candle3.gif"
          alt="Freebirds birthday bowl with candle">

      </div>

    </section>


    <!-- AFTER OCTOBER 28 -->
    <section class="state post-state hidden" id="postState">

      <div class="post-inner">
        <h1>Thanks for Celebrating With Us!</h1>
        <p>39 years of Freebirds World Burrito.</p>
      </div>

    </section>

  </main>


  <script>

    /*
      ======================================
      NATIONAL FREEBIRDS DAY DATE SETTINGS
      ======================================

      Start:
      October 28, 2026 at 12:00 AM CDT

      End:
      October 29, 2026 at 12:00 AM CDT
    */

    const eventStart =
      new Date("2026-10-28T00:00:00-05:00").getTime();

    const eventEnd =
      new Date("2026-10-29T00:00:00-05:00").getTime();


    const countdownState =
      document.getElementById("countdownState");

    const celebrationState =
      document.getElementById("celebrationState");

    const postState =
      document.getElementById("postState");


    const DAY = 86400000;
    const HOUR = 3600000;
    const MINUTE = 60000;


    function showState(state) {

      countdownState.classList.add("hidden");
      celebrationState.classList.add("hidden");
      postState.classList.add("hidden");

      state.classList.remove("hidden");
    }


    function update() {

      const now = Date.now();

      /*
        BEFORE OCTOBER 28
      */

      if (now < eventStart) {

        showState(countdownState);

        const remaining =
          eventStart - now;

        const days =
          Math.floor(remaining / DAY);

        const hours =
          Math.floor((remaining % DAY) / HOUR);

        const minutes =
          Math.floor((remaining % HOUR) / MINUTE);

        const seconds =
          Math.floor((remaining % MINUTE) / 1000);


        document.getElementById("days").textContent =
          days;

        document.getElementById("hours").textContent =
          String(hours).padStart(2, "0");

        document.getElementById("minutes").textContent =
          String(minutes).padStart(2, "0");

        document.getElementById("seconds").textContent =
          String(seconds).padStart(2, "0");

        return;
      }


      /*
        OCTOBER 28
      */

      if (now >= eventStart && now < eventEnd) {

  showState(celebrationState);

  loadBirthdayBowl();
  createConfetti();

  return;
}


      /*
        AFTER OCTOBER 28
      */

      showState(postState);
    }

    let bowlLoaded = false;

function loadBirthdayBowl() {

  if (bowlLoaded) return;

  const bowl = document.getElementById("birthdayBowl");

  if (!bowl) return;

  bowl.src = bowl.dataset.src;
  bowlLoaded = true;
}

    let confettiCreated = false;

    function createConfetti() {

      if (confettiCreated) return;

      confettiCreated = true;

      const container =
        document.getElementById("nfd");

      const colors = [
        "#ff651d",
        "#292929",
        "#ffffff",
        "#f47db3",
        "#4caa72"
      ];

      for (let i = 0; i < 32; i++) {

        const piece =
          document.createElement("span");

        piece.className =
          "confetti";

        piece.style.left =
          Math.random() * 100 + "%";

        piece.style.background =
          colors[
            Math.floor(
              Math.random() * colors.length
            )
          ];

        piece.style.animationDuration =
          (4 + Math.random() * 4) + "s";

        piece.style.animationDelay =
          (-Math.random() * 8) + "s";

        container.appendChild(piece);
      }
    }


// START LIVE EXPERIENCE
update();
setInterval(update, 1000);

  </script>

</body>
</html>
